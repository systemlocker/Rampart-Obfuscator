name: Rampart release readiness

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-and-pack:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true

    steps:
      - name: Check out Rampart
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Rampart.slnx

      - name: Verify formatting
        run: dotnet format Rampart.slnx --no-restore --verify-no-changes

      - name: Build
        run: dotnet build Rampart.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test Rampart.slnx --configuration Release --no-build --logger trx --results-directory artifacts/test-results

      - name: Pack
        run: dotnet pack Rampart.slnx --configuration Release --no-build --output artifacts/packages -p:ContinuousIntegrationBuild=true

      - name: Upload release candidates
        uses: actions/upload-artifact@v4
        with:
          name: rampart-${{ github.ref_name }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/test-results/*.trx
          if-no-files-found: error
